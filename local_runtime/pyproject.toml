[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-voice-runtime"
version = "0.1.0"
description = "Loopback-only local runtime for Voice Studio"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.18,<1"]

[project.optional-dependencies]
tts = ["qwen-tts==0.1.1", "soundfile>=0.12"]

[tool.setuptools.packages.find]
include = ["local_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
